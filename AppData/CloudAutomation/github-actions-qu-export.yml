name: QU Admin Terminal Export

on:
  workflow_dispatch:
  schedule:
    # 4 AM, 10 AM, 4 PM, and 10 PM America/New_York during daylight saving time.
    # Adjust to 09,15,21,03 UTC during standard time if exact local-time alignment is required.
    - cron: "0 8,14,20,2 * * *"

jobs:
  export-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: AppData/CloudAutomation
      - run: npx playwright install --with-deps chromium
        working-directory: AppData/CloudAutomation
      - run: npm run export-and-import
        working-directory: AppData/CloudAutomation
        env:
          QU_ADMIN_URL: https://admin.qubeyond.com/n/operations/terminals
          QU_ADMIN_USER: ${{ secrets.QU_ADMIN_USER }}
          QU_ADMIN_PASS: ${{ secrets.QU_ADMIN_PASS }}
          QU_APP_IMPORT_URL: https://quposapp.qupostech.com/api/cloud-import.php
          QU_APP_IMPORT_TOKEN: ${{ secrets.QU_APP_IMPORT_TOKEN }}
          QU_EXPORT_ARTIFACT_DIR: artifacts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: qu-admin-export-diagnostics
          path: AppData/CloudAutomation/artifacts/
          if-no-files-found: ignore
          retention-days: 7
