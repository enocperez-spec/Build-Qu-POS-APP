name: QU Admin Terminal Export

on:
  workflow_dispatch:
  schedule:
    # Default 8 AM and 2 PM Eastern daylight-saving windows.
    - cron: "0 12,18 * * *"

jobs:
  export-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: AppData/CloudAutomation
      - run: npx playwright install --with-deps chromium
        working-directory: AppData/CloudAutomation
      - run: npm run export-and-import
        working-directory: AppData/CloudAutomation
        env:
          QU_EXPORT_MODE: terminals
          QU_ADMIN_URL: https://admin.qubeyond.com/n/operations/terminals
          QU_ADMIN_USER: ${{ secrets.QU_ADMIN_USER }}
          QU_ADMIN_PASS: ${{ secrets.QU_ADMIN_PASS }}
          QU_APP_IMPORT_URL: https://quposapp.qupostech.com/api/cloud-import.php
          QU_APP_IMPORT_TOKEN: ${{ secrets.QU_APP_IMPORT_TOKEN }}
          QU_TRIGGER_TYPE: ${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Scheduled' }}
          QU_EXPORT_ARTIFACT_DIR: artifacts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: qu-admin-export-diagnostics
          path: AppData/CloudAutomation/artifacts/
          if-no-files-found: ignore
          retention-days: 7
