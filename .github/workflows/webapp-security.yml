name: Web Application Security Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: PHP syntax check
        run: find WebApp tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Security service tests
        run: php tests/security_service_test.php

      - name: Web security regression tests
        run: php tests/web_security_regression_test.php

      - name: Frontend security tests
        run: node tests/web_security_frontend_test.js

      - name: Cloud automation authentication tests
        run: node tests/cloud_automation_test.js
