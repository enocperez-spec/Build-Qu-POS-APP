name: QU Admin Terminal Export

on:
  workflow_dispatch:
  schedule:
    # Runs every 6 hours starting at 4:00 AM America/New_York during daylight saving time.
    # GitHub Actions schedules use UTC, so this maps to 4 AM, 10 AM, 4 PM, and 10 PM EDT.
    - cron: "0 8,14,20,2 * * *"

jobs:
  export-and-import:
    name: Export QU terminals and update dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install automation dependencies
        run: npm install
        working-directory: AppData/CloudAutomation

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: AppData/CloudAutomation

      - name: Export QU Admin terminal CSV and import into web app
        run: npm run export-and-import
        working-directory: AppData/CloudAutomation
        env:
          QU_ADMIN_URL: https://admin.qubeyond.com/n/operations/terminals
          QU_ADMIN_USER: ${{ secrets.QU_ADMIN_USER }}
          QU_ADMIN_PASS: ${{ secrets.QU_ADMIN_PASS }}
          QU_APP_IMPORT_URL: https://quposapp.qupostech.com/api/cloud-import.php
          QU_APP_IMPORT_TOKEN: ${{ secrets.QU_APP_IMPORT_TOKEN }}
          QU_EXPORT_ARTIFACT_DIR: artifacts

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qu-admin-export-diagnostics
          path: AppData/CloudAutomation/artifacts/
          if-no-files-found: ignore
          retention-days: 7
