name: QU Admin Store Information Export

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedules use UTC. These are the default 8 AM and 2 PM Eastern
    # daylight-saving windows; editable app schedules are stored in the database.
    - cron: "0 12,18 * * *"

jobs:
  export-and-import:
    name: Export QU stores and update database
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install automation dependencies
        run: npm install
        working-directory: AppData/CloudAutomation

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: AppData/CloudAutomation

      - name: Export QU Admin store CSV and import into web app
        run: npm run export-and-import
        working-directory: AppData/CloudAutomation
        env:
          QU_EXPORT_MODE: stores
          QU_ADMIN_URL: https://admin.qubeyond.com/configuration/stores/
          QU_ADMIN_USER: ${{ secrets.QU_ADMIN_USER }}
          QU_ADMIN_PASS: ${{ secrets.QU_ADMIN_PASS }}
          QU_APP_IMPORT_URL: https://quposapp.qupostech.com/api/cloud-store-import.php
          QU_APP_IMPORT_TOKEN: ${{ secrets.QU_APP_IMPORT_TOKEN }}
          QU_TRIGGER_TYPE: ${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Scheduled' }}
          QU_EXPORT_ARTIFACT_DIR: artifacts

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qu-admin-store-export-diagnostics
          path: AppData/CloudAutomation/artifacts/
          if-no-files-found: ignore
          retention-days: 7
